name: Terraform Plan

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'terraform/**'

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: terraform init -backend-config="key=${{ github.base_ref }}.tfstate"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Terraform Validate
        run: terraform validate

      - name: Trivy Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -var-file="${{ github.base_ref }}.tfvars" -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        continue-on-error: true

      - name: Show Plan Output
        id: show
        run: terraform show -no-color tfplan > plan_output.txt

      - name: Post Plan to PR
        uses: actions/github-script@v7
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8').slice(0, 60000)
            const body = `### Terraform Plan — target branch \`${{ github.base_ref }}\`
            <details><summary>Click to expand plan</summary>

            \`\`\`
            ${plan}
            \`\`\`

            </details>

            Plan status: ${{ steps.plan.outcome }}`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1